# XcodeGen spec for the CordisShowcase iOS app: `xcodegen generate` in
# this directory writes CordisShowcase.xcodeproj (not committed).
name: CordisShowcase
options:
  bundleIdPrefix: com.eovidiu.cordis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ShowcaseKit:
    path: ShowcaseKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CordisShowcase:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ShowcaseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eovidiu.cordis.showcase
        PRODUCT_NAME: CordisShowcase
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cordis
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  CordisShowcaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: CordisShowcase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eovidiu.cordis.showcase.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: CordisShowcase
schemes:
  CordisShowcase:
    build:
      targets:
        CordisShowcase: all
    test:
      targets:
        - CordisShowcaseUITests
